# Save this file at: .github/workflows/daily.yml in your repo root.
#
# Runs update_feed.py every morning and commits the refreshed feed.json.
# Set two repo secrets first (Settings -> Secrets and variables -> Actions):
#   GMAIL_USER
#   GMAIL_APP_PASSWORD

name: Update 1440 Flash Briefing

on:
  schedule:
    # Cron is in UTC. 11:00 UTC = 5:00 AM Mountain Daylight Time (UTC-6).
    # When daylight saving ends (~early November) and it becomes Mountain
    # Standard Time (UTC-7), change both lines below to 12:00/12:10 UTC
    # to stay at 5:00 AM.
    - cron: "40 14 * * *"
    # Backup trigger 10 minutes later — GitHub's scheduled runs are
    # "best effort" and occasionally get delayed or dropped entirely,
    # especially on lower-activity repos. If the first one already ran
    # today, this one just runs again harmlessly (it'll simply refetch
    # today's email and overwrite feed.json with the same content).
    - cron: "45 14 * * *"
    - cron: "22 11 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python update_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Update 1440 flash briefing feed" || echo "No changes to commit"
          git push
